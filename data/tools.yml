    最终效果：广告如果与正常内容共域、已缓存或直接内置在 App 中，则不会经过这个判断。'
  tool_type: VPN 隧道 + 服务端 DNS/域名过滤
  protection_target: 两者（源头网络阻断，条件式）｜CleanWeb 规则命中的广告、追踪与恶意域名
  limitations: 主要依赖 DNS/网络规则，无法处理已经加载、与业务共域或直接内置在 App 中的广告。
  tier: 直接防护工具/客户端
  platform: 跨平台
  access: VPN 服务/订阅
  effort:
  - level: low
  status: 可用
  section: A.1
  catalog_section: tools
  en:
    description: Surfshark VPN’s CleanWeb feature is used to block ads, trackers, and malicious sites.
    workflow: '**Where it starts:** Surfshark CleanWeb filters domains on the VPN/DNS server.<br>

      **How it decides:** After a device''s request enters its tunnel or resolver, it is compared against a list of ads, tracking or malicious domains,<br>

      **What it does:** The hit resolution/connection was refused, so the corresponding network resource cannot be loaded;<br>

      **Possible result:** If the ad is in the same domain as normal content, has been cached, or is directly built into the app, it will not pass this judgment.'
    tool_type: VPN tunnel + server-side DNS/domain filtering
    protection_target: Both (source network blocking, conditional)｜Advertising, tracking and malicious domains hit by CleanWeb rules
    limitations: Mainly relies on DNS/network rules and cannot handle ads that are already loaded, co-domained with the business, or built directly into the app.
    tier: Direct protection tools/clients
    platform: Cross-platform
    access: VPN / DNS / proxy
    category: Ad-handling tools and rules
    effort_display: 🟢 Low effort
    safety_notice: Will take over part of the network connection or DNS resolution
    type_note: ''
