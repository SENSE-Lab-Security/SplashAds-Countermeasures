  tool_type: LSPosed/Xposed + Uri.parse Hook + Deep Link scheme 重写
  protection_target: 触发跳转型｜淘宝/京东 Deep Link（tbopen、openapp.jdmobile）触发的外部 App 跳转
  limitations: 只覆盖项目明确处理的淘宝/京东 URI scheme；需要 LSPosed/Xposed。若目标应用改用其他 scheme、普通 HTTP/App Link、显式 Intent 或其他跳转路径，可能不受该 Hook 影响；广告本身不会被移除。
