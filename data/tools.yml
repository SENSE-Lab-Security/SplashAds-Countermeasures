- id: 113
  name: 'One Patch: touch blocking for ad regions'
  url: https://github.com/Overbaker/One-Patch/tree/b5a19eb1606a0a2dc4738036ca4e07d6e2a9aee8
  description: Android 触摸屏蔽工具，在指定矩形区域放置 Overlay 并吞掉触摸事件，可用于屏蔽易误触的 UI 区域，包括 sticky ads。
  workflow: '触发/感知入口：用户在屏幕上指定需要保护的矩形区域，One Patch 在该区域创建 TYPE_APPLICATION_OVERLAY；启用无障碍时也可使用 TYPE_ACCESSIBILITY_OVERLAY。

    识别/判定依据：它不识别广告，而是由用户预先指定“这里的触摸不要交给下层 App”。

    干预点与手段：Overlay View 的 onTouchEvent 返回 true，直接消费区域内的 DOWN/MOVE/UP/CANCEL 等触摸事件。

    最终效果：下层 App/广告无法收到这些 tap/swipe 事件，因此依赖该区域触摸触发的广告点击或跳转不会发生。'
  tool_type: Touch / Gesture Shielding｜Android Overlay + onTouchEvent 事件消费 + 可选 Accessibility Overlay
  protection_target: 触发跳转型（输入层）｜固定/大面积广告区域中的点击、滑动等触摸触发与误触
  limitations: 不是广告识别工具，需要用户手动设定区域；会同时屏蔽该区域内的正常交互。系统手势区、键盘及调用 HIDE_OVERLAY_WINDOWS 的 App 等场景可能无法覆盖。
  tier: 直接防护工具/客户端
  platform: Android
  access: 悬浮窗权限
  effort:
  - level: moderate
  status: 可用
  section: A.1
  catalog_section: tools
  en:
    description: The Android touch shielding tool places an Overlay in a specified rectangular area and swallows touch events. It can be used to shield UI areas that are prone to accidental activationes, including sticky ads.
    workflow: '**Where it starts:** The user specifies a rectangular area on the screen that needs to be protected, and One Patch creates a TYPE_APPLICATION_OVERLAY in that area; TYPE_ACCESSIBILITY_OVERLAY can also be used when accessibility is enabled.<br>

      **How it decides:** It does not recognize ads, but is pre-specified by the user "Do not pass the touch here to the underlying app".<br>

      **What it does:** Follow the project instructions for processing in the request, interface or jump phase.<br>

      **Possible result:** The underlying app/ad cannot receive these tap/swipe events, so ad taps or jumps that rely on touch triggers in this area will not occur.'
    tool_type: The implementation method remains to be verified
    protection_target: Navigation-triggering (input layer) | Touch triggering and accidental activationes such as taps and swiping in fixed/large advertising areas
    limitations: It is not an ad recognition tool and requires the user to manually set the area; it will also block normal interactions in the area. Scenarios such as the system gesture area, keyboard, and apps that call HIDE_OVERLAY_WINDOWS may not be covered.
    tier: Direct protection tools/clients
    platform: Android
    access: Overlay
    category: Ad-handling tools and rules
    effort_display: 🟡 Moderate effort
    safety_notice: Check the source, version, and permissions before use.
    type_note: ''
