- id: 15
  name: Fuck Shake
  url: https://github.com/pwh-pwh/fuck_shake
  description: 利用 Xposed Hook 目标 App 的摇一摇/传感器相关注册或回调，使 shake 信号无法继续进入广告跳转逻辑。
  workflow: '触发/感知入口：Fuck Shake 通过 Xposed 注入用户选择的 App，并 Hook 与加速度计/摇一摇检测相关的注册或回调逻辑。

    识别/判定依据：不是识别广告页面，而是把命中的 shake/传感器相关调用视为需要抑制的触发链入口。

    干预点与手段：在传感器/shake 回调层阻止相关注册、回调或后续处理继续执行。

    最终效果：手机晃动不再能正常驱动该 App 中的 shake-triggered 广告/跳转逻辑；点击、滑动等其他触发仍可能存在。'
  tool_type: Xposed + 摇一摇/传感器触发 Hook
  protection_target: 触发跳转型｜加速度计/摇一摇触发的广告跳转链；不覆盖点击、滑动等其他触发
  limitations: 主要切断 shake/运动触发，对点击、滑动、自动跳转等其他路径没有直接作用；App 内部 shake 实现变化后 Hook 也可能失效。
  tier: 直接防护工具/客户端
  platform: Android
  access: Xposed/LSPosed
  effort:
  - level: high
  status: 维护情况不明
  section: A.1
  catalog_section: tools
  en:
    description: Uses Xposed to hook shake/sensor-related registration or callback logic in the target app, preventing shake signals from continuing into the ad redirect logic.
    workflow: '**Where it starts:** Fuck Shake injects the user-selected app via Xposed and hooks registration or callback logic related to accelerometer/shake detection.<br>

      **How it decides:** Instead of identifying ad pages, it treats hit shake/sensor related calls as trigger chain entries that need to be suppressed.<br>

      **What it does:** Prevents related registration, callback or subsequent processing from continuing to execute at the sensor/shake callback layer.<br>

      **Possible result:** Shaking the phone can no longer drive the shake-triggered ad redirect logic in the app; other triggers such as taps and swipes may still exist.'
    tool_type: Xposed + Shake/Sensor Trigger hook
    protection_target: Navigation-triggering｜Ad redirect chain triggered by accelerometer/shake; does not cover taps, swipes and other triggers
    limitations: It mainly blocks shake/motion triggers and does not directly affect other paths such as taps, swipes, or automatic redirects; the hook may also stop working if the app changes its internal shake implementation.
    tier: Direct protection tools/clients
    platform: Android
    access: Runtime Injection
    category: Ad-handling tools and rules
    effort_display: 🔴 High effort
    safety_notice: May affect system security or application stability
    type_note: ''
- id: 16
  name: NoShakingAD / Bu Xu Tiaozhuan
  url: https://github.com/WeiyePlayer/no-shakingAD
  description: 利用 Accessibility Service 判断目标 App 刚启动，再通过 Shizuku 调用 SensorService 的 restricted mode/白名单机制，在开屏时间窗内临时屏蔽运动传感器。
  workflow: '触发/感知入口：NoShakeAD 用 Accessibility Service 感知前台 App 切换，确认用户刚打开了配置过的目标 App。

    识别/判定依据：它不识别广告画面，而是把“目标 App 刚启动后的若干秒”作为高风险开屏时间窗。

    干预点与手段：借助 Shizuku 调用 SensorService 的 restricted mode/白名单机制，在这段时间内让目标 App 收不到正常运动传感器事件，随后再恢复。

    最终效果：开屏广告仍可能显示，但依赖加速度/运动数据的摇一摇触发链会在输入层失效。'
  tool_type: Accessibility Service + Shizuku + SensorService restricted mode/白名单
  protection_target: 触发跳转型｜App 启动后数秒内依赖运动传感器的摇一摇开屏广告
  limitations: 主要针对启动阶段的运动传感器触发，点击/滑动广告仍会存在；时间窗或 SensorService 控制范围不合适时，正常传感器功能也可能短暂受影响。
  tier: 直接防护工具/客户端
  platform: Android
  access: Accessibility；Shizuku
  effort:
  - level: moderate
  status: 可用
  section: A.1
  catalog_section: tools
  en:
    description: Uses the Accessibility Service to determine that the target app has just started, and then call the restricted mode/whitelist mechanism of SensorService through Shizuku to temporarily block the motion sensor during the splash window.
    workflow: '**Where it starts:** NoShakeAD uses Accessibility Services to sense foreground app switching and confirm that the user has just opened the configured target app.<br>

      **How it decides:** It does not identify ad screens, but uses "a few seconds after the target app is launched" as a high-risk splash window.<br>

      **What it does:** Uses Shizuku to call the restricted mode/whitelist mechanism of SensorService, so that the target app cannot receive normal motion sensor events during this period, and then recover.<br>

      **Possible result:** Open-screen ads may still be displayed, but the shake trigger chain that relies on acceleration/motion data will fail at the input layer.'
    tool_type: The implementation method remains to be verified
    protection_target: Navigation-triggering｜Shake-to-open ads that rely on motion sensors within seconds after the app is launched
    limitations: Mainly for motion sensor triggering in the startup phase, tap/swipe ads will still exist; when the time window or SensorService control range is inappropriate, normal sensor functions may also be temporarily affected.
    tier: Direct protection tools/clients
    platform: Android
    access: Accessibility; Debugging (Shizuku)
    category: Ad-handling tools and rules
    effort_display: 🟡 Moderate effort
    safety_notice: Only grant accessibility permissions to trusted sources
    type_note: ''
- id: 17
  name: Rule Imprison (permissions and state handling awaiting verification)
  url: https://github.com/Kingtous/rule_imprison_android/tree/e2686ec4012010d69a40682c1d51220a38a53060
  description: Monitors when a source app enters the foreground and calls setApplicationHidden to temporarily hide specified shopping apps, restricting destination-app launches; corresponds to ad navigation.
  workflow: '触发/感知入口：Android; device / profile owner or corresponding delegated privileges, an accessibility service, and compilation after configuring targets in source code. Source only / build needed. No prebuilt installation package was found; building does not resolve the implementation issues listed here.

    识别/判定依据：Monitors when a source app enters the foreground and calls setApplicationHidden to temporarily hide specified shopping apps, restricting destination-app launches; corresponds to ad navigation.

    干预点与手段：Navigation Interception / Confirmation (permissions and state handling awaiting verification)

    最终效果：The initial isHidden value may cause the first hiding call to be skipped; set-active-admin in the documentation does not confer the owner status required by the API. Actual authorization, initial hiding, and restoration need verification. The XML configuration uses typeAllMask, so the dynamic configuration alone does not establish that no events can be received.'
