  name: app2smile ad network rules + Surge / Quantumult X
  url: https://github.com/app2smile/rules
  description: 通过 HTTP(S) MITM + Rewrite / Map Local 匹配广告 API，可直接改写请求/响应或伪造本地空响应，使广告数据在进入 App 前被删除或替换。
  workflow: '触发/感知入口：Surge 的 HTTP engine 接收经代理的 HTTP 流量；HTTPS 主机在启用 MITM 后可被解密并进入重写流程。

    识别/判定依据：按 URL 正则、Host、请求/响应内容或脚本规则识别广告 API/广告字段，而不是判断屏幕上的广告 UI。

    干预点与手段：在资源/数据返回阶段使用 Map Local/API Mock、URL/Header/Body Rewrite 或 JavaScript 脚本返回空数据、替换字段或阻断请求。

    最终效果：广告 API 或素材请求可在到达 App 前被改写/置空，因此广告可能不再展示，同时正常同域业务请求仍可保留。'
  tool_type: HTTP(S) / API Response Rewrite｜MITM + Map Local/API Mock + URL/Header/Body Rewrite + JavaScript
  protection_target: 两者（资源/数据层）｜可由 URL/响应结构精确匹配的广告 API、JSON 广告字段和广告素材请求
  limitations: 需要配置规则和 MITM 证书；证书固定（certificate pinning）、QUIC/非 HTTP 流量或未进入 Surge HTTP engine 的连接可能无法改写；规则通常需要按 App/API 维护。
  tier: 直接防护工具/客户端
  platform: iOS
  access: 代理规则客户端
  effort:
  - level: moderate
  status: 可用
  section: A.1
  catalog_section: tools
  en:
    description: Through the HTTP(S) MITM + Rewrite / Map Local matching ad API, the request/response can be directly rewritten or the local empty response can be forged, so that the ad data is deleted or replaced before entering the app.
    workflow: '**Where it starts:** Surge''s HTTP engine receives proxied HTTP traffic; HTTPS hosts can be decrypted and entered into the rewrite process when MITM is enabled.<br>

      **How it decides:** Identifies ad APIs/ad fields by URL regex, host, request/response content, or script rules instead of judging on-screen ad UI.<br>

      **What it does:** Uses Map Local/API Mock, URL/Header/Body Rewrite or JavaScript scripts to return empty data, replace fields or block requests during the resource/data return phase.<br>

      **Possible result:** Advertising API or material requests can be overwritten/blanked before reaching the app, so ads may no longer be displayed, while normal same-domain business requests can still remain.'
    tool_type: The implementation method remains to be verified
    protection_target: Both (resource/data layer) | Ad API, JSON ad fields and creative requests that can be matched exactly by URL/response structure
    limitations: Rules and MITM certificates need to be configured; certificate pinning, QUIC/non-HTTP traffic, or connections that do not enter the Surge HTTP engine may not be rewritten; rules generally need to be maintained per app/API.
    tier: Direct protection tools/clients
    platform: iOS
    access: VPN / DNS / proxy
    category: Ad-handling tools and rules
    effort_display: 🟡 Moderate effort
    safety_notice: Will take over part of the network connection or DNS resolution
    type_note: ''
- id: 111
  name: 'AdblockAndroid: developer integration library'
  url: https://github.com/Edsuns/AdblockAndroid/tree/a585487eb19328f635a5b7b983fa38d4c97f2bc8
  description: 面向 Android WebView 的广告过滤引擎库，兼容 EasyList/AdGuard Filters，并支持 element hiding、Extended CSS、CSS rules 和 Scriptlet rules。
  workflow: '触发/感知入口：开发者把 AdblockAndroid 集成到目标 App/浏览器的 WebView，过滤引擎可看到 WebView 的资源加载和页面内容。

    识别/判定依据：依据 EasyList、AdGuard Filters、自定义规则、CSS selector 和 scriptlet 规则识别广告请求或广告页面元素。

    干预点与手段：在 WebView 资源加载阶段阻断匹配请求，并在页面渲染阶段执行 element hiding、CSS/Extended CSS 或 scriptlet。

    最终效果：WebView 中的广告资源可不被加载，已进入页面的广告 DOM/元素也可被隐藏或脚本化处理。'
  tool_type: WebView / DOM / CSS / Scriptlet Filtering｜Android WebView + EasyList/AdGuard Filters + Element Hiding + CSS/Scriptlet
  protection_target: 纯展示型（WebView 内容层）｜WebView 中的广告网络请求、HTML/DOM 广告元素、样式与脚本
  limitations: 属于开发库而非独立系统级 blocker，需要集成到目标 App/浏览器的 WebView；不能直接处理原生 Android View 广告、传感器触发或跨 App 跳转。
  tier: 应用专用补丁/模块
  platform: Android
  access: 开发者集成
  effort:
  - level: developer
  status: 维护情况不明
  section: A.1
  catalog_section: cooperative
  en:
    description: Used to handle ad requests, ad interfaces, or ad redirects, depending on the apps and versions supported by the project.
    workflow: '**Where it starts:** Developers integrate AdblockAndroid into the WebView of the target app/browser, and the filtering engine can see the resource loading and page content of the WebView.<br>

      **How it decides:** Identifies ad requests or ad page elements based on EasyList, AdGuard Filters, custom rules, CSS selector and scriptlet rules.<br>

      **What it does:** Blocks matching requests during the WebView resource loading phase and perform element hiding, CSS/Extended CSS or scriptlets during the page rendering phase.<br>

      **Possible result:** The ad resources in WebView can not be loaded, and the advertising DOM/elements that have entered the page can also be hidden or scripted.'
    tool_type: The implementation method remains to be verified
    protection_target: Display-only (WebView content layer)｜Ad network requests, HTML/DOM advertising elements, styles and scripts in WebView
    limitations: It is a development library rather than an independent system-level blocker and needs to be integrated into the WebView of the target app/browser; it cannot directly handle native Android View ads, sensor triggers or cross-app jumps.
