  name: 'Rethink DNS + Firewall: advertising domain rules'
  url: https://github.com/celzero/rethink-app/tree/22e129d7277cc19899219aee116814371a5fda01
  description: 提供 DNS 黑名单、本地 VPN、按应用防火墙、流量日志和可选 WireGuard。
  workflow: '触发/感知入口：Rethink 建立本地 VPN（VpnService），使 App 流量和 DNS 查询经过其网络栈。

    识别/判定依据：依据 DNS blocklist、目标域名/连接以及用户配置的按 App 防火墙规则判断是否允许通信，而不是识别广告 UI。

    干预点与手段：在网络连接建立或 DNS 解析阶段直接拒绝命中的请求。

    最终效果：被规则命中的广告/跟踪资源无法联网加载。'
  tool_type: 本地 VPN（VpnService）+ DNS/连接过滤
  protection_target: 两者（源头网络阻断，条件式）｜DNS blocklist 命中的广告/跟踪域名，以及按 App 防火墙规则拒绝的连接
  limitations: 不能可靠区分与业务共用域名的广告；本地 VPN 模式还会与其他 VPN 竞争同一系统槽位。
  tier: 直接防护工具/客户端
  platform: Android
  access: 本地 VPN/DNS
  effort:
  - level: low
  status: 可用
  section: A.1
  catalog_section: tools
  en:
    description: Provides DNS blacklisting, local VPN, per-app firewall, traffic logs, and optional WireGuard.
    workflow: '**Where it starts:** Rethink establishes a local VPN (VpnService) so that app traffic and DNS queries go through its network stack.<br>

      **How it decides:** Allow traffic based on DNS blocklist, target domain/connection, and user-configured per-app firewall rules, rather than identifying ad UI.<br>

      **What it does:** Reject hit requests directly during the network connection establishment or DNS resolution phase.<br>

