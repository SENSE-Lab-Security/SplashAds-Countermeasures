tools:
- id: 1
  name: GKD with specified advertising subscriptions
  url: https://github.com/gkd-kit/gkd
  description: 利用 Accessibility Service 读取页面 UI 节点并按订阅规则匹配“跳过/关闭”，再用无障碍点击/手势自动跳过广告。
  workflow: '触发/感知入口：GKD 通过 Accessibility Service 监听窗口/页面变化，并读取系统暴露的 Accessibility Node/UI 控件树。

    识别/判定依据：根据订阅规则中的包名、页面条件、控件文字、resource ID、节点层级/选择器等判断目标“跳过/关闭”控件是否出现；它通常不是直接理解“这是广告”。

    干预点与手段：在广告 UI 已展示阶段，调用无障碍节点点击或 Gesture 手势能力操作目标控件。

    最终效果：广告通常仍会先加载/显示，但“跳过/关闭”操作由工具自动完成。'
  tool_type: Accessibility Service + UI 无障碍节点 + 规则/选择器
  protection_target: 纯展示型｜开屏广告中可由无障碍节点定位的“跳过/关闭”控件，以及规则可描述的重复 UI
  limitations: 广告仍会先加载并显示；规则依赖 UI 节点和页面结构，App 改版、Canvas/WebView 或自绘界面可能让匹配失效。
  tier: 直接防护工具/客户端
  platform: Android
  access: Accessibility
  effort:
  - level: moderate
  status: 可用
  section: A.1
  catalog_section: tools
  en:
    description: Uses accessibility services to read page UI nodes and match "skip/close" according to subscription rules, and then use accessibility taps/gestures to automatically skip ads.
    workflow: '**Where it starts:** GKD listens to window/page changes through Accessibility Services and reads the Accessibility Node/UI control tree exposed by the system.<br>

      **How it decides:** Determines whether the target "skip/close" control appears based on the package name, page conditions, control text, resource ID, node level/selector, etc. in the subscription rules; it usually does not directly understand "this is an ad".<br>

      **What it does:** During the display phase of the ad UI, call the accessibility node click or gesture capabilities to operate the target control.<br>

      **Possible result:** The ad will usually still load/show first, but the "skip/close" operation is done automatically by the tool.'
    tool_type: Accessibility services + UI accessibility nodes + rules/selectors
    protection_target: Display-only｜"skip/close" controls in splash ads that can be located through Accessibility nodes, and repeated UI that can be described by rules
    limitations: Ads will still be loaded and displayed first; rules depend on UI nodes and page structure, and app updates, Canvas/WebView or custom-rendered interfaces may invalidate matching.
    tier: Direct protection tools/clients
    platform: Android
    access: Accessibility
    category: Ad-handling tools and rules
    effort_display: 🟡 Moderate effort
    safety_notice: Only grant accessibility permissions to trusted sources
    type_note: ''
- id: 2
  name: SKIP
  url: https://github.com/GuoXiCheng/SKIP
  description: 利用 Accessibility Service 感知启动页和可访问控件，并按本地/订阅规则定位跳过按钮后自动点击。
  workflow: '触发/感知入口：SKIP 使用 Accessibility Service 监听 App 启动、窗口变化并读取当前页面的可访问控件。

    识别/判定依据：依据本地/订阅规则，把特定 App/页面中的文字、控件属性等与“跳过/关闭”目标匹配。

    干预点与手段：在开屏广告 UI 阶段调用 Accessibility 的点击能力操作匹配控件。

    最终效果：广告本身可能已显示，但跳过动作被自动完成；网络加载和 shake 触发本身没有被源头阻断。'
  tool_type: Accessibility Service + 规则/订阅匹配
  protection_target: 纯展示型｜普通启动页/开屏广告中的可访问跳过按钮，尤其是订阅规则已适配的页面
  limitations: 不阻止广告加载或摇一摇等触发；规则随 App UI 变化可能失效，自绘控件也可能无法被无障碍树识别。
  tier: 直接防护工具/客户端
  platform: Android
  access: Accessibility
  effort:
  - path: 内置或本地规则
    level: low
  - path: 导入订阅规则
    level: moderate
  status: 可用
  section: A.1
  catalog_section: tools
  en:
    description: Uses accessibility services to sense startup pages and accessible controls, and automatically click on skip buttons after locating them based on local/subscription rules.
    workflow: '**Where it starts:** SKIP uses Accessibility Services to listen for app startup, window changes, and read the current page''s accessible controls.<br>

      **How it decides:** Matches the text, control properties, etc. in a specific app/page with the "skip/close" target based on local/subscription rules.<br>

      **What it does:** Calls Accessibility''s click ability to operate the matching control during the opening ad UI phase.<br>

      **Possible result:** The ad itself may have been displayed, but the skip action was completed automatically; network loading and shake triggering themselves were not blocked by the source.'
    tool_type: Accessibility Services + Rules/Subscription Matching
    protection_target: Display-only｜Accessible skip button in normal startup page/splash ad, especially the page where subscription rules have been adapted
    limitations: It does not prevent ad loading or triggering by shaking; rules may become invalid as the app UI changes, and self-drawn controls may not be recognized by the accessibility tree.
    tier: Direct protection tools/clients
    platform: Android
    access: Accessibility
    category: Ad-handling tools and rules
    effort_display: 'Built-in or local rules: 🟢 Low effort; Imported subscription rules: 🟡 Moderate effort'
    safety_notice: Only grant accessibility permissions to trusted sources
    type_note: ''
- id: 3
  name: AdSkip / Android-Touch-Helper
  url: https://github.com/zfdang/Android-Touch-Helper
  description: 利用 Accessibility Service 按关键词、UI 控件或坐标识别目标，并通过无障碍点击自动处理开屏广告。
  workflow: '触发/感知入口：Android-Touch-Helper 用 Accessibility Service 读取当前页面，

    识别/判定依据：可按文字关键词、具体 UI 控件或预设坐标寻找目标。

    干预点与手段：规则命中后，它仍通过无障碍点击/手势去操作对应位置，

    最终效果：所以适合自动点“跳过/关闭”，但并不阻止广告资源本身加载。'
  tool_type: Accessibility Service + 关键词/UI 控件/坐标匹配
  protection_target: 纯展示型｜可通过文字、UI 控件或固定坐标定位的开屏“跳过/关闭”目标
  limitations: 依赖页面可识别和规则维护；固定坐标对布局变化敏感，自绘 UI 也可能无法稳定匹配。
  tier: 直接防护工具/客户端
  platform: Android
  access: Accessibility
  effort:
  - level: moderate
  status: 可用
  section: A.1
  catalog_section: tools
  en:
    description: Leverage accessibility services to identify targets by keyword, UI control, or coordinates and automatically handle splash ads with accessible taps.
    workflow: '**Where it starts:** Android-Touch-Helper uses accessibility services to read the current page,<br>

      **How it decides:** You can find targets by text keywords, specific UI controls or preset coordinates.<br>

      **What it does:** After the rule is hit, it still operates the corresponding position through barrier-free taps/gestures,<br>

      **Possible result:** So it is suitable for automatically clicking "Skip/Close", but it does not prevent the ad resource itself from loading.'
    tool_type: Accessibility services + keywords/UI controls/coordinate matching
    protection_target: Display-only | Screen-opening "skip/close" targets that can be positioned via text, UI controls, or fixed coordinates
    limitations: Rely on page recognition and rule maintenance; fixed coordinates are sensitive to layout changes, and custom-rendered UI may not be able to match stably.
    tier: Direct protection tools/clients
    platform: Android
    access: Accessibility
    category: Ad-handling tools and rules
    effort_display: 🟡 Moderate effort
    safety_notice: Only grant accessibility permissions to trusted sources
    type_note: ''
- id: 4
  name: AdSkipper (decemberpei)
  url: https://play.google.com/store/apps/details?id=decemberpei.gmail.adskipper
  description: 检测可见的 Skip 按钮并通过无障碍服务自动点击。
  workflow: '触发/感知入口：AdSkipper 依赖 Accessibility Service 观察可访问的 UI，

    识别/判定依据：重点寻找已经出现的 Skip/Close 控件。

    干预点与手段：匹配到相应节点后直接调用无障碍点击；

    最终效果：它解决的是“帮用户点掉广告”，而不是提前屏蔽广告网络请求或触发逻辑。'
  tool_type: Accessibility Service + UI 节点/关键词/坐标规则 + 点击手势
  protection_target: 纯展示型｜已经显示且能被 Accessibility 读取到的 Skip/Close 控件
  limitations: 主要覆盖有可识别 Skip/Close 控件的广告；闭源/商店版本的具体识别规则和数据处理方式不容易审计。
  tier: 直接防护工具/客户端
  platform: Android
  access: Accessibility
  effort:
  - level: low
  status: 可用
  section: A.1
  catalog_section: limited
  en:
    description: Detect visible Skip buttons and automatically click them through accessibility services.
    workflow: '**Where it starts:** AdSkipper Depends on Accessibility Services Observe Accessible UI,<br>

      **How it decides:** Focus on looking for the Skip/Close control that has appeared.<br>

      **What it does:** Directly call barrier-free click after matching the corresponding node;<br>

      **Possible result:** It solves the problem of "helping users click out ads", rather than blocking ad network requests or triggering logic in advance.'
    tool_type: Accessibility services + UI nodes/keywords/coordinate rules + click gestures
    protection_target: Display-only｜Skip/Close controls that have been displayed and can be read by Accessibility
    limitations: Mainly covers ads with identifiable Skip/Close controls; the specific identification rules and data processing methods of the closed source/store version are not easy to audit.
    tier: Direct protection tools/clients
    platform: Android
    access: Accessibility
    category: Ad-handling tools and rules
    effort_display: 🟢 Low effort
    safety_notice: Only grant accessibility permissions to trusted sources
    type_note: ''
- id: 5
  name: Li Tiaotiao (original version and rule ecosystem)
  url: https://github.com/rongzhiy/LiTiaotiao
  description: 利用 Accessibility Service 读取开屏页的可访问 UI，并按规则定位“跳过/关闭”控件后自动点击。
  workflow: '触发/感知入口：李跳跳开启 Accessibility Service 后监听窗口/页面变化并读取 Accessibility Node。

    识别/判定依据：依据目标 App、控件文字/属性等规则判断“跳过/关闭”控件是否出现，而不是从视觉语义上理解广告。

    干预点与手段：在开屏 UI 已显示阶段调用无障碍点击能力操作目标控件。

    最终效果：广告通常仍会先展示，但工具替用户完成跳过/关闭。'
  tool_type: Accessibility Service + UI 节点识别
  protection_target: 纯展示型｜开屏页中进入无障碍树的“跳过/关闭”按钮及已适配页面
  limitations: 广告仍会先显示；依赖页面节点和规则适配。项目已于 2023 年宣布无限期停止更新。
  tier: 直接防护工具/客户端
  platform: Android
  access: Accessibility
  effort:
  - path: 原版内置规则
    level: low
  - path: 手动导入社区规则
    level: moderate
  status: 已停更/归档
  section: A.1
  catalog_section: tools
  en:
    description: Uses the accessibility service to read the accessible UI of the splash screen, locate the "skip/close" control according to the rules and automatically click it.
    workflow: '**Where it starts:** Li Tiaotiao turns on the accessibility service and then monitors window/page changes and reads the Accessibility Node.<br>

      **How it decides:** Determines whether the "skip/close" control appears based on the rules of the target app, control text/properties, etc., rather than understanding the ad from the visual semantics.<br>

      **What it does:** Calls the accessibility click capability to operate the target control during the displayed phase of the screen-opening UI.<br>

      **Possible result:** The ad will usually still show first, but the tool will skip/close it for the user.'
    tool_type: Accessibility Services + UI Node Identification
    protection_target: Display-only｜"Skip/Close" button to enter the accessibility tree on the splash screen and the adapted page
    limitations: Ads will still be displayed first; it depends on page nodes and rule adaptation. The project announced in 2023 that it would stop updating indefinitely.
    tier: Direct protection tools/clients
    platform: Android
    access: Accessibility
    category: Ad-handling tools and rules
    effort_display: 'Built-in rules (original release): 🟢 Low effort; Manual community-rule import: 🟡 Moderate effort'
    safety_notice: Only grant accessibility permissions to trusted sources
    type_note: ''
- id: 6
  name: ZeroStart
  url: https://github.com/code-wanghao/ZeroStart/tree/4914b5c375a374bef57f0d8020457063845198a5
  description: 结合 UI 树、离线 OCR 和位置启发式识别开屏广告，强调防误触和老年用户场景。
  workflow: '触发/感知入口：ZeroStart 先用 Accessibility Service 读取当前 UI；

    识别/判定依据：如果节点信息不够，再结合截图、离线 OCR 和位置启发式去找跳过控件。

    干预点与手段：确定目标位置后通过无障碍点击/手势操作，

    最终效果：重点是提高对“UI 树里不好找”的开屏按钮的识别能力。'
  tool_type: Accessibility Service + UI 树匹配 + 离线 OCR + 位置启发式
  protection_target: 两者（UI 跳过，间接防跳转）｜UI 树难以直接定位、但可由 OCR/位置启发式发现的开屏跳过按钮
  limitations: 截图/OCR 会增加识别时间；真实广告覆盖率和对误触/摇一摇场景的效果仍需要实测。
  tier: 直接防护工具/客户端
  platform: Android
  access: Accessibility
  effort:
  - level: low
  status: 可用
  section: A.1
  catalog_section: tools
  en:
    description: Combining UI tree, offline OCR and position heuristics to identify splash ads, emphasizing accidental activation prevention and elderly user scenarios.
    workflow: '**Where it starts:** ZeroStart first uses the accessibility service to read the current UI;<br>

      **How it decides:** If the node information is not enough, combine screenshots, offline OCR and position heuristics to find skip controls.<br>

      **What it does:** After determining the target position, operate through barrier-free taps/gestures,<br>

      **Possible result:** The focus is to improve the recognition ability of the screen opening button that is "difficult to find in the UI tree".'
    tool_type: Accessibility Services + UI Tree Matching + Offline OCR + Location Heuristics
    protection_target: Both (UI skip, indirect anti-jump)｜Open screen skip button that is difficult to locate directly in the UI tree but can be discovered by OCR/position heuristics
    limitations: Screenshots/OCR will increase recognition latency; real advertising coverage and the effect on accidental activation/shake scenes still need to be measured.
    tier: Direct protection tools/clients
    platform: Android
    access: Accessibility
    category: Ad-handling tools and rules
    effort_display: 🟢 Low effort
    safety_notice: Only grant accessibility permissions to trusted sources
    type_note: ''
- id: 7
  name: PureSkip
  url: https://github.com/miaomiao636/PureSkip/tree/8620083fed2f4186c03992349b0aac39f43cb62e
  description: 采用离线确定性规则和按应用策略自动跳过已适配启动广告。
  workflow: '触发/感知入口：PureSkip 用 Accessibility Service 观察启动页，

    识别/判定依据：并按每个 App 的离线规则匹配文字、resource ID、节点关系或坐标。

    干预点与手段：规则命中后直接用无障碍点击完成跳过；

    最终效果：它不需要联网判断广告，但适配效果取决于已有规则是否覆盖当前版本。'
  tool_type: Accessibility Service + 离线规则 + 按应用策略
  protection_target: 纯展示型｜已有离线按应用规则覆盖的启动广告和跳过控件
  limitations: 适配范围由现有规则决定，App 页面结构变化后需要更新规则。
  tier: 直接防护工具/客户端
  platform: Android
  access: Accessibility；源码构建
  effort:
  - level: high
  status: 维护情况不明
  section: A.1
  catalog_section: tools
  en:
    description: Automatically skips adapted launch ads using offline deterministic rules and per-app policies.
    workflow: '**Where it starts:** PureSkip uses Accessibility Services to observe the startup page,<br>

      **How it decides:** and match text, resource ID, node relationship or coordinates according to each app''s offline rules.<br>

      **What it does:** After the rule is hit, directly use the barrier-free click to complete the skip;<br>

      **Possible result:** It does not require an Internet connection to determine advertising, but the adaptation effect depends on whether the existing rules cover the current version.'
    tool_type: Accessibility Services + Offline Rules + Per-app Policies
    protection_target: Display-only｜There are already startup ads and skip controls covered by offline application rules
    limitations: The adaptation scope is determined by existing rules, and the rules need to be updated after the app page structure changes.
    tier: Direct protection tools/clients
    platform: Android
    access: Accessibility; Source Build
    category: Ad-handling tools and rules
    effort_display: 🔴 High effort
    safety_notice: Please only grant accessibility permissions to trusted sources; more suitable for developers or researchers, and cannot be installed directly as a normal app
    type_note: ''
- id: 8
  name: SplashCleaner-Android
  url: https://github.com/hui01101/SplashCleaner-Android
  description: 利用 Accessibility Service 感知 App 启动，并在短暂启动扫描窗口内按本地规则查找跳过/关闭控件后自动点击。
  workflow: '触发/感知入口：SplashCleaner 在 Accessibility Service 感知到目标 App 刚启动后，

    识别/判定依据：只在短暂的启动窗口里扫描当前页面。

    干预点与手段：它根据本地规则寻找“跳过/关闭”等无障碍控件，找到后立即点击，

    最终效果：因此不会长期盯着所有页面，也不会从网络层屏蔽广告。'
  tool_type: Accessibility Service + 本地规则 + 启动扫描窗口
  protection_target: 纯展示型｜App 启动后短时间窗口内出现的可访问“跳过/关闭”控件
  limitations: 不阻断广告网络请求，广告仍可能先显示；如果跳过按钮不在无障碍树里或出现时间超出扫描窗口，就可能漏掉。
  tier: 直接防护工具/客户端
  platform: Android
  access: Accessibility
  effort:
  - level: low
  status: 可用
  section: A.1
  catalog_section: tools
  en:
    description: Uses Accessibility Services to sense app startup and automatically click on skip/close controls based on local rules within the short startup scan window.
    workflow: '**Where it starts:** SplashCleaner<br>

      **How it decides:** Only scan the current page during the short startup window.<br>

      **What it does:** It looks for accessibility controls such as "Skip/Close" based on local rules, and taps immediately when found,<br>

      **Possible result:** So no long-term staring at all pages, no blocking of ads from the network layer.'
    tool_type: Accessibility Services + Local Rules + Start Scan Window
    protection_target: Display-only｜Accessible "skip/close" control that appears within a short window after the app is launched
    limitations: Without blocking ad network requests, the ad may still be displayed first; if the skip button is not in the accessibility tree or appears outside the scanning window, it may be missed.
    tier: Direct protection tools/clients
    platform: Android
    access: Accessibility
    category: Ad-handling tools and rules
    effort_display: 🟢 Low effort
    safety_notice: Only grant accessibility permissions to trusted sources
    type_note: ''
- id: 9
  name: madeye/ad-skipper
  url: https://github.com/madeye/ad-skipper
  description: 先用 Accessibility 节点找跳过按钮，失败时再用截图 + OCR/YOLO/VLM 定位，并通过无障碍手势点击。
  workflow: '触发/感知入口：这个 Ad Skipper 先走成本最低的 Accessibility 节点匹配；

    识别/判定依据：找不到跳过按钮时再截屏，依次用 OCR、YOLO，必要时用 VLM grounding 定位目标。

    干预点与手段：无论目标来自节点还是视觉坐标，最后都通过 Accessibility 的点击/手势执行，

    最终效果：因此它扩展的是“怎么找到按钮”，不是广告加载阶段的拦截。'
  tool_type: Accessibility + 屏幕截图 + OCR/YOLO/VLM + 无障碍手势
  protection_target: 纯展示型｜无障碍树缺失或自绘情况下，仍可由 OCR/YOLO/VLM 定位的开屏跳过按钮
  limitations: 视觉识别比纯 UI 节点匹配更慢，也可能误检/漏检；对于一出现就迅速触发跳转的广告，识别完成时可能已经太晚。
  tier: 直接防护工具/客户端
  platform: Android
  access: Accessibility
  effort:
  - path: 内置节点、文字和图像识别
    level: low
  - path: 额外下载并配置 VLM
    level: moderate
  status: 可用
  section: A.1
  catalog_section: tools
  en:
    description: First use the Accessibility node to find the skip button. If it fails, use screenshot + OCR/YOLO/VLM to locate it and click it through accessibility gestures.
    workflow: '**Where it starts:** This Ad Skipper matches the Accessibility node with the lowest cost first;<br>

      **How it decides:** Take a screenshot when you can''t find the skip button, use OCR, YOLO, and VLM grounding to locate the target if necessary.<br>

      **What it does:** Regardless of whether the target comes from a node or a visual coordinate, it is finally executed through Accessibility''s click/gesture,<br>

      **Possible result:** Therefore, it extends "how to find the button", not the interception during the ad loading stage.'
    tool_type: Accessibility + Screenshot + OCR/YOLO/VLM + Accessibility Gestures
    protection_target: Display-only｜When the accessibility tree is missing or self-drawn, the screen-opening skip button can still be positioned by OCR/YOLO/VLM
    limitations: Visual recognition is slower than pure UI node matching, and may also be produce false positives or missed detections; for ads that trigger redirects as soon as they appear, it may be too late by the time the recognition is completed.
    tier: Direct protection tools/clients
    platform: Android
    access: Accessibility
    category: Ad-handling tools and rules
    effort_display: 'Built-in node, text, and image recognition: 🟢 Low effort; Additional VLM download and setup: 🟡 Moderate effort'
