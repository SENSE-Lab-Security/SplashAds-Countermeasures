  description: 利用 LSPosed 注入特定 App，并 Hook 已知广告方法/数据路径，在开屏、Banner 或视频广告执行前修改或跳过逻辑。
  workflow: '触发/感知入口：FanqieHook 通过 LSPosed 注入已支持的目标 App，并等待预先定位的广告相关方法被调用。

