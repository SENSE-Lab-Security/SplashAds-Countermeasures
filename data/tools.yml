- id: 96
  name: AdClose
  url: https://github.com/zjyzip/AdClose
  description: 利用 LSPosed/Xposed Hook 广告 SDK、网络和 SensorManager 等调用，在广告初始化/加载或 shake 监听阶段直接截断逻辑。
  workflow: '触发/感知入口：AdClose 通过 LSPosed/Xposed 注入目标 App，并监控预先适配的广告 SDK 方法、网络调用或 SensorManager 监听注册。

    识别/判定依据：当已知广告 SDK/传感器相关类和方法被调用时，认为相应广告或 shake 逻辑正在执行；不是通过 UI 识别广告。

    干预点与手段：在广告 SDK/App logic 或传感器 listener 注册阶段直接短路方法、修改返回值或阻止/移除监听。

    最终效果：广告 SDK 可能无法初始化/加载，或 shake 监听无法建立，从而更早切断广告/触发链。'
  tool_type: LSPosed/Xposed + 广告 SDK/API Hook + 传感器监听控制
  protection_target: 两者（多层防护）｜开屏/应用内广告、摇一摇触发广告
  limitations: 通常需要 Root + LSPosed/Xposed；App/SDK 更新、代码混淆、动态加载或 native 实现都可能让 Hook 失效，需要持续适配。
  tier: 应用专用补丁/模块
  platform: Android
  access: Root；Xposed/LSPosed
  effort:
  - level: high
  status: 可用
  section: A.1
  catalog_section: tools
  en:
    description: Uses LSPosed/Xposed hook advertising SDK, network and SensorManager calls to directly truncate logic during the advertising initialization/loading or shake listening phase.
    workflow: '**Where it starts:** AdClose injects the target app via LSPosed/Xposed and monitors pre-adapted ad SDK methods, network calls, or SensorManager listener registrations.<br>

      **How it decides:** When known ad SDK/sensor related classes and methods are called, the corresponding ad or shake logic is considered to be executed; the ad is not identified through the UI.<br>

      **What it does:** Directly short-circuit methods, modify return values, or block/remove listening during the advertising SDK/app logic or sensor listener registration phase.<br>

      **Possible result:** The advertising SDK may fail to initialize/load, or the shake listener may not be established, thus cutting off the advertising/triggering chain earlier.'
    tool_type: LSPosed/Xposed + Advertising SDK/API hook + Sensor monitoring control
    protection_target: Both (multi-layer protection)｜Open screen/in-app advertising, shake to trigger advertising
    limitations: Root + LSPosed/Xposed is usually required; app/SDK updates, code obfuscation, dynamic loading or native implementation may make hook invalid, and continuous adaptation is required.
    tier: Apply specific patches/modules
    platform: Android
    access: Root; Runtime Injection
    category: Ad-handling tools and rules
    effort_display: 🔴 High effort
    safety_notice: May affect system security or application stability
    type_note: ''
