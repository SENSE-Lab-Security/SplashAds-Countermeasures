- id: 47
  name: AdAway
  url: https://github.com/AdAway/AdAway
  description: 利用系统 hosts 或 Android 本地 VPN 接管域名解析，并用广告域名黑名单阻断匹配请求。
  workflow: '触发/感知入口：Root 模式下由系统 hosts 参与域名解析；无 Root 模式下由 Android VpnService 接管 DNS/网络请求。

    识别/判定依据：把 App 请求的域名与 hosts/blocklist 中的广告域名比较，不判断当前 UI 是否为广告。

    干预点与手段：在 DNS/连接阶段把命中的广告域名解析到无效地址或直接拒绝连接。

    最终效果：广告资源无法从对应服务器正常加载；已经缓存或与正常业务共域的广告不受此机制直接影响。'
  tool_type: hosts 文件 / 本地 VPN（VpnService）+ 域名黑名单
  protection_target: 两者（源头网络阻断，条件式）｜命中 hosts/blocklist 的广告与跟踪域名；可覆盖部分网络加载型开屏广告
  limitations: 依赖广告域名可被单独识别；广告与正常业务共域、已经缓存或直接打包在 App 内时效果有限。
  tier: 直接防护工具/客户端
  platform: Android
  access: 本地 VPN/DNS；Root
  effort:
  - path: 本地 VPN
    level: low
  - path: Root hosts
    level: high
  status: 可用
  section: A.1
  catalog_section: tools
  en:
    description: Uses system hosts or Android local VPN to take over DNS resolution, and use advertising domain blocklist to block matching requests.
    workflow: '**Where it starts:** In Root mode, system hosts participate in DNS resolution; in Root-less mode, Android VpnService takes over DNS/network requests.<br>

      **How it decides:** Compares the domain requested by the app with the ad domain in hosts/blocklist, and does not determine whether the current UI is an ad.<br>

      **What it does:** In the DNS/connection stage, resolve the hit ad domain to an invalid address or directly refuse the connection.<br>

      **Possible result:** Advertising resources cannot be loaded normally from the corresponding server; ads that have been cached or are in the same domain as normal content are not directly affected by this mechanism.'
    tool_type: hosts file / local VPN (VpnService) + domain blocklist
    protection_target: Both (source network blocking, conditional)｜Ads and tracking domains that hit hosts/blocklist; can cover some network-loaded splash ads
    limitations: Depends on ad domains being identifiable separately; coverage is limited when ads share a domain with normal content, are already cached, or are bundled directly into the app.
